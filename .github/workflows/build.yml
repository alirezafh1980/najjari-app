name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            automake \
            m4 \
            libtool \
            libtool-bin \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            cmake \
            ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.33"
          python -m pip install --upgrade buildozer

      - name: Build APK
        run: |
          yes | buildozer -v android debug
        env:
          ACLOCAL_PATH: /usr/share/aclocal

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: bin/*.apk
          if-no-files-found: error
